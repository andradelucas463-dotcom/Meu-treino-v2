<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230b0d12'/%3E%3Cg fill='%2322c55e'%3E%3Crect x='76' y='206' width='60' height='100' rx='14'/%3E%3Crect x='376' y='206' width='60' height='100' rx='14'/%3E%3Crect x='136' y='246' width='240' height='20' rx='6'/%3E%3C/g%3E%3C/svg%3E">
<title>Meu Treino Pro 💪</title>
<style>
  :root {
    --bg: #0b0d12; --bg2: #0f1218; --card: #171a22; --card2: #1e222d;
    --border: #262b38; --text: #e8ebf2; --muted: #7f889e;
    --accent: #22c55e; --accent-dark: #15803d; --danger: #ef4444; --warn: #f59e0b;
    --info: #3b82f6; --gold: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding-bottom: calc(240px + env(safe-area-inset-bottom)); }
  .app { max-width: 680px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px 20px; }

  .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap; font-weight: 600;}
  .btn-ghost:active { background: var(--card); }

  .banner { padding: 10px 12px; border-radius: 10px; font-size: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .banner-warn { background: #3b2e0f; border: 1px solid var(--warn); color: var(--warn); }
  .banner-info { background: #0f1e3d; border: 1px solid var(--info); color: #93c5fd; }
  .banner button { background: transparent; border: none; color: inherit; font-size: 18px; cursor: pointer; padding: 0; line-height: 1; }
  .banner .banner-action { font-size: 12px; padding: 4px 10px; border: 1px solid currentColor; border-radius: 6px; font-weight: 700; cursor: pointer; background: transparent; color: inherit; }

  .tabs-container { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; flex: 1; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; min-width: 48px; background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #0b0d12; }
  .tab-btn-add { background: transparent; border: 1px dashed var(--border); color: var(--muted); width: 38px; height: 38px; border-radius: 10px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .day-header { margin: 20px 0 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .day-header h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 6px; }
  .day-subtitle { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .day-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-mini { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; }

  .progress-wrap { margin-bottom: 16px; }
  .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .progress-info strong { color: var(--text); }
  .progress-bar { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

  .exercise { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; transition: opacity 0.2s, border-color 0.2s; }
  .exercise.completed { opacity: 0.75; border-color: var(--accent-dark); }
  .exercise-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .exercise-title-wrap { flex: 1; }
  .exercise-name { font-size: 15px; font-weight: 600; line-height: 1.3; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .btn-icon { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 4px; }
  .btn-icon:hover { color: var(--text); }
  .btn-move { background: var(--card2); border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .exercise-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .exercise-muscles { font-size: 11px; color: #86efac; margin-bottom: 10px; font-style: italic; }
  .pr-badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--gold); color: #0b0d12; font-weight: 800; margin-left: 4px; }

  .exercise-notes { width: 100%; padding: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--warn); font-size: 12px; margin-bottom: 10px; resize: none; font-family: inherit; }
  .exercise-notes::placeholder { color: #4b5563; }

  .exercise-sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .last-session { font-size: 11px; color: var(--muted); font-style: italic; }
  .last-session.has { color: #86efac; }
  .btn-bump { background: var(--card2); border: 1px solid var(--border); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }

  .set-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; }
  .set-label { width: 22px; text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; }
  .set-label.warmup { color: var(--warn); }
  .set-check { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.12s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .set-check.done { background: var(--accent); border-color: var(--accent); color: #0b0d12; }
  .set-check.warmup.done { background: var(--warn); border-color: var(--warn); }
  .set-input { width: 66px; padding: 8px 4px; text-align: center; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 600; }
  .set-input.reps { width: 60px; }
  .set-input:focus { outline: none; border-color: var(--accent); }
  .set-input::placeholder { color: #4b5563; font-weight: 400; font-size: 11px; }
  .set-unit { font-size: 11px; color: var(--muted); font-weight: 600; }
  .set-x { color: var(--muted); font-weight: 700; font-size: 12px; }
  .set-mode { background: none; border: none; color: var(--muted); font-size: 10px; cursor: pointer; padding: 2px; }

  .btn-add-exercise { width: 100%; padding: 12px; margin-bottom: 10px; background: var(--card2); border: 1px dashed var(--border); border-radius: 10px; color: var(--accent); font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-repeat { width: 100%; padding: 10px; margin-bottom: 10px; background: transparent; border: 1px solid var(--info); color: var(--info); border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-finish { width: 100%; padding: 14px; margin: 8px 0; background: var(--accent); border: none; border-radius: 12px; color: #0b0d12; font-size: 15px; font-weight: 800; cursor: pointer; }
  .btn-finish:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-rest { width: 100%; padding: 10px; margin-bottom: 10px; background: transparent; border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 150; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); width: 100%; max-width: 450px; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
  .modal-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 16px; font-weight: 700; margin: 0; }
  .modal-close { background: transparent; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; }
  .modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .modal-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .form-input, .form-select { width: 100%; padding: 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }
  .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  .btn-primary { background: var(--accent); color: #0b0d12; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn-danger { background: var(--danger); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn-danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }

  .option-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
  .option-item { background: var(--bg2); border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: var(--text); font-size: 14px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px;}
  .option-item.current { border-color: var(--accent); background: rgba(34,197,94,0.1); }
  .option-item:active { background: var(--card); }

  .history-empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  .toast { position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-100px); padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; z-index: 200; transition: transform 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.4); max-width: 90vw; text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--accent); color: #0b0d12; }
  .toast.error { background: var(--danger); color: #fff; }
  .toast.warn { background: var(--warn); color: #0b0d12; }

  .timer-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg2); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 100; display: flex; flex-direction: column; gap: 10px; max-width: 680px; margin: 0 auto; }
  .timer-bar.running { border-top-color: var(--accent); }
  .timer-bar.ringing { animation: ring 0.4s ease-in-out 6; }
  @keyframes ring { 0%,100% { background: var(--bg2); } 50% { background: #7f1d1d; } }
  .timer-row { display: flex; align-items: center; gap: 6px; }
  .timer-display { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700; letter-spacing: 0.5px; flex: 1; }
  .timer-bar.running .timer-display { color: var(--accent); }
  .timer-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 10px; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .timer-btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; width: 48px; height: 44px; font-size: 18px; }
  .timer-btn.muted { color: var(--muted); }
  .presets { display: flex; gap: 6px; }
  .preset { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .preset.active { background: var(--accent-dark); border-color: var(--accent); color: #fff; }

  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .chart-card h3 { margin: 0 0 10px; font-size: 15px; }
  .chart-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .chart-tab { flex: 1; padding: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
  .chart-tab.active { background: var(--accent-dark); border-color: var(--accent); color: #fff; }
  .chart-canvas { width: 100%; height: 200px; display: block; }
  .history-filters { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .filter-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0b0d12; }

  .history-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .history-summary { padding: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .history-date { font-size: 14px; font-weight: 600; }
  .history-info { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .history-chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
  .history-item.open .history-chevron { transform: rotate(90deg); }
  .history-details { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .history-item.open .history-details { display: block; }
  .history-ex { padding: 8px 0; border-bottom: 1px solid var(--card2); }
  .history-ex-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .history-ex-sets { font-size: 12px; color: var(--muted); }
  .history-ex-note { font-size: 11px; color: var(--warn); font-style: italic; margin-top: 4px; }
  .btn-small-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }

  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .stat-value { font-size: 20px; font-weight: 800; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .summary-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--card2); font-size: 14px; }
  .summary-item strong { color: var(--accent); }
</style>
</head>
<body>

<div class="app">
  <div class="title-row">
    <h1>💪 Meu Treino Pro</h1>
    <div class="header-actions">
      <button class="btn-ghost" id="btnBackup">Backup</button>
      <button class="btn-ghost" id="btnRestore">Restaurar</button>
      <button class="btn-ghost" id="btnResetAll" style="color:var(--danger); border-color:var(--danger);">Zerar</button>
    </div>
  </div>
  <div id="updateBanner"></div>
  <div id="backupReminder"></div>
  <div class="tabs-container">
    <div class="tabs" id="tabs"></div>
    <button class="tab-btn-add" id="btnAddDay" title="Adicionar Dia">+</button>
  </div>
  <div id="main"></div>
</div>

<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<div class="timer-bar" id="timerBar">
  <div class="timer-row">
    <div class="timer-display" id="timerDisplay">01:00</div>
    <button class="timer-btn muted" id="muteBtn" title="Som">🔔</button>
    <button class="timer-btn" data-action="-15">−15</button>
    <button class="timer-btn" data-action="+15">+15</button>
    <button class="timer-btn" id="resetTimer">↺</button>
    <button class="timer-btn primary" id="startPause">▶</button>
  </div>
  <div class="presets">
    <button class="preset" data-sec="30">30s</button>
    <button class="preset" data-sec="60">1min</button>
    <button class="preset" data-sec="90">1:30</button>
    <button class="preset" data-sec="120">2min</button>
    <button class="preset" data-sec="180">3min</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Título</h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

function generateId(prefix) {
  return (prefix || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}
function getLocalDateStr(d) {
  const dt = d || new Date();
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}
function safeGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); return true; } catch { showToast("Falha ao salvar!","error"); return false; } }

function swapIdFor(name) {
  return "sub_" + String(name).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
function isBodyweightExercise(name) {
  const n = String(name || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return /(flexao|barra fixa|prancha|mergulho|abdominal|mobilidade|alongamento|esteira|bicicleta|eliptico|roda abdominal)/.test(n);
}

function migrateData(raw) {
  const data = raw || {};
  if (!Array.isArray(data.treinos) || data.treinos.length === 0) data.treinos = JSON.parse(JSON.stringify(defaultTreinos));
  if (!data.current) data.current = {};
  if (!Array.isArray(data.history)) data.history = [];
  if (!data.templates) data.templates = {};
  if (!data.sessionStarted) data.sessionStarted = {};

  const usedIds = new Set();
  data.treinos.forEach(t => {
    t.exercicios.forEach(e => {
      if (!e.id) e.id = generateId("ex");
      if (usedIds.has(e.id)) e.id = generateId("ex");
      usedIds.add(e.id);
      if (e.musculos && !e.main) { e.main = e.musculos; e.sec = ""; delete e.musculos; }
    });
  });

  data.history.forEach(h => {
    if (!h.timestamp) h.timestamp = new Date(h.date || Date.now()).getTime();
    if (!h.dateLocal) h.dateLocal = h.date || getLocalDateStr();
    if (!h.dayId && h.dayName) {
      const tr = data.treinos.find(t => t.dia === h.dayName || t.nome === h.workoutName);
      if (tr) h.dayId = tr.id;
    }
    h.exercises.forEach(ex => {
      if (ex.weightless === undefined) ex.weightless = isBodyweightExercise(ex.name);
      if (!ex.targetReps) {
        const tr = h.dayId ? data.treinos.find(t => t.id === h.dayId) : null;
        const trEx = tr && tr.exercicios.find(x => x.nome === ex.name || x.id === ex.id);
        if (trEx) ex.targetReps = trEx.reps;
      }
      if (!ex.id || ex.id.startsWith("h_")) {
        let match = null;
        if (h.dayId) {
          const tr = data.treinos.find(t => t.id === h.dayId);
          const e = tr && tr.exercicios.find(x => x.nome === ex.name);
          if (e) match = e.id;
        }
        if (!match) for (const tr of data.treinos) {
          const e = tr.exercicios.find(x => x.nome === ex.name);
          if (e) { match = e.id; break; }
        }
        if (!match) match = "hist_" + String(ex.name || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"").substr(0,20);
        ex.id = match;
      }
    });
  });

  data.version = DATA_VERSION;
  return data;
}

function loadState() {
  let raw = safeGet(STORAGE_KEY);
  if (!raw) {
    for (const legacy of LEGACY_KEYS) {
      const old = safeGet(legacy);
      if (old) {
        try {
          const migrated = migrateData(JSON.parse(old));
          safeSet(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        } catch {}
      }
    }
    return migrateData({});
  }
  try { return migrateData(JSON.parse(raw)); }
  catch { return migrateData({}); }
}

function cleanupLegacyKeys() {
  // Item 10: apaga chaves antigas após 3 dias da primeira abertura v11
  const firstLoad = safeGet(LEGACY_INSTALL_KEY);
  if (!firstLoad) {
    safeSet(LEGACY_INSTALL_KEY, String(Date.now()));
  } else {
    const days = (Date.now() - parseInt(firstLoad)) / 86400000;
    if (days > 3) {
      LEGACY_KEYS.forEach(k => { try { localStorage.removeItem(k); } catch {} });
    }
  }
}

  return state.treinos[0]?.id || "segunda";

function ensureData() {
  if (!state.current) state.current = {};
  if (!state.templates) state.templates = {};
  if (!state.sessionStarted) state.sessionStarted = {};
  if (!state.templates["🌟 Protocolo Original (Upper/Lower)"]) {
    state.templates["🌟 Protocolo Original (Upper/Lower)"] =
      JSON.parse(JSON.stringify([...defaultTreinos[0].exercicios, ...defaultTreinos[1].exercicios]));
  }
  state.treinos.forEach(t => {
    if (!state.current[t.id]) state.current[t.id] = {};
    const c = state.current[t.id];
    if (!Array.isArray(c.checks)) c.checks = [];
    if (!Array.isArray(c.weights)) c.weights = [];
    if (!Array.isArray(c.reps)) c.reps = [];
    if (!Array.isArray(c.warmups)) c.warmups = [];
    if (!c.customNames) c.customNames = {};
    if (!c.notes) c.notes = {};
    t.exercicios.forEach((e, i) => {
      if (!e.id) e.id = generateId("ex");
      if (!Array.isArray(c.checks[i])) c.checks[i] = Array(e.series).fill(false);
      if (!Array.isArray(c.weights[i])) c.weights[i] = Array(e.series).fill("");
      if (!Array.isArray(c.reps[i])) c.reps[i] = Array(e.series).fill("");
      if (!Array.isArray(c.warmups[i])) c.warmups[i] = Array(e.series).fill(false);
      c.checks[i] = c.checks[i].slice(0, e.series);
      c.weights[i] = c.weights[i].slice(0, e.series);
      c.reps[i] = c.reps[i].slice(0, e.series);
      c.warmups[i] = c.warmups[i].slice(0, e.series);
      while (c.checks[i].length < e.series) c.checks[i].push(false);
      while (c.weights[i].length < e.series) c.weights[i].push("");
      while (c.reps[i].length < e.series) c.reps[i].push("");
      while (c.warmups[i].length < e.series) c.warmups[i].push(false);
    });
  });
}

/* ============ HELPERS ============ */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function showToast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + (type || "success");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2500);
}
function parseWeight(v) {
  if (v === null || v === undefined || v === "") return 0;
  const s = String(v).replace(",",".").trim();
  const n = parseFloat(s);
  return isNaN(n) || n < 0 ? 0 : n;
}
function parseReps(v) {
  if (!v) return 0;
  const s = String(v).trim().toLowerCase();
  if (/^\d+$/.test(s)) return parseInt(s,10);
  const ms = s.match(/^(\d+)\s*(s|seg)\b/);
  if (ms) return parseInt(ms[1],10);
  const mm = s.match(/^(\d+)\s*(min|minuto)/);
  if (mm) return parseInt(mm[1],10) * 60;
  return 0;
}
function isTimeBased(v) { return /\d\s*(s|seg|min|minuto)\b/i.test(String(v || "")); }
function fmtDate(iso) { if (!iso) return ""; const [y,m,d] = String(iso).split("-"); return `${d}/${m}/${y}`; }

// Item 1: busca por id OU nome. Aceita id=null para só buscar por nome.
function getLastSessionForExercise(exId, exName) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const h = state.history[i];
    if (h.isRest) continue;
    const ex = h.exercises.find(e =>
      (exId && e.id === exId) || (exName && e.name === exName)
    );
    if (ex) return { date: h.dateLocal, sets: ex.sets, name: ex.name, id: ex.id };
  }
  return null;
}
function getPRForExercise(exId, exName, excludeEntryId) {
  let maxWeight = 0, maxReps = 0, maxVolume = 0;
  state.history.forEach(h => {
    if (h.isRest) return;
    if (excludeEntryId && h.id === excludeEntryId) return;
    h.exercises.forEach(ex => {
      if (!((exId && ex.id === exId) || (exName && ex.name === exName))) return;
      if (ex.weightless || isTimeBased(ex.targetReps)) return;
      ex.sets.forEach(s => {
        if (!s.done || s.isWarmup) return;
        if (isTimeBased(s.reps)) return;
        const w = parseWeight(s.weight), r = parseReps(s.reps);
        if (w > maxWeight) maxWeight = w;
        if (r > maxReps) maxReps = r;
        if (w * r > maxVolume) maxVolume = w * r;
      });
    });
  });
  return { maxWeight, maxReps, maxVolume };
}
// Item 9: volume = 0 para tempo ou bodyweight
function calcSessionVolume(entry) {
  if (!entry || entry.isRest) return 0;
  return entry.exercises.reduce((sum, ex) => {
    if (ex.weightless || isTimeBased(ex.targetReps)) return sum;
    if (isBodyweightExercise(ex.name)) return sum;
    return sum + ex.sets.filter(s => {
      if (!s.done || s.isWarmup) return false;
      if (isTimeBased(s.reps)) return false;
      return true;
    }).reduce((v, s) => v + parseWeight(s.weight) * parseReps(s.reps), 0);
  }, 0);
}

function ensureAudio() {
  if (!audioCtx) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    } catch {}
  }
  if (audioCtx && audioCtx.state !== "running") {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}
function beep(delay) {
  setTimeout(() => {
    const ctx = ensureAudio();
    if (!ctx || ctx.state !== "running") return;
    try {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
      o.start(); o.stop(ctx.currentTime + 0.4);
    } catch {}
  }, delay);
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function generateIconPNG(size, paddingPct) {
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0b0d12"; ctx.fillRect(0, 0, size, size);
  const p = (paddingPct || 0) * size;
  const s = size - p * 2;
  const cx = size / 2, cy = size / 2;
  const barW = 240/512*s, barH = 20/512*s, weightW = 60/512*s, weightH = 100/512*s, r = 14/512*s;
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(cx - barW/2, cy - barH/2, barW, barH);
  roundRectPath(ctx, cx - barW/2 - weightW, cy - weightH/2, weightW, weightH, r); ctx.fill();
  roundRectPath(ctx, cx + barW/2, cy - weightH/2, weightW, weightH, r); ctx.fill();
  return canvas.toDataURL("image/png");
}

document.getElementById("modalOverlay").onclick = (e) => { if (e.target.id === "modalOverlay") closeModal(); };

function confirmModal(title, message, confirmLabel, danger) {
  return new Promise(resolve => {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = `<p style="font-size:14px; line-height:1.5; color:var(--text); margin:0;">${message}</p>`;
    const f = document.getElementById("modalFooter");
    f.innerHTML = `<button class="btn-secondary" id="mCancel">Cancelar</button>
      <button class="${danger ? 'btn-danger' : 'btn-primary'}" id="mConfirm">${esc(confirmLabel || "Confirmar")}</button>`;
    f.querySelector("#mCancel").onclick = () => { closeModal(); resolve(false); };
    f.querySelector("#mConfirm").onclick = () => { closeModal(); resolve(true); };
    openModal();
  });
}
function promptModal(title, defaultValue, onSave) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = `<div class="form-group"><input type="text" id="promptValue" class="form-input" value="${esc(defaultValue || "")}"></div>`;
  const f = document.getElementById("modalFooter");
  f.innerHTML = `<button class="btn-secondary" id="mCancel">Cancelar</button><button class="btn-primary" id="mSave">Salvar</button>`;
  f.querySelector("#mCancel").onclick = closeModal;
  f.querySelector("#mSave").onclick = () => {
    const v = document.getElementById("promptValue").value.trim();
    if (!v) return; closeModal(); onSave(v);
  };
  openModal();
}

/* ============ RENDER ============ */
function render() {
  ensureData();
  renderUpdateBanner();
  renderBackupReminder();
  renderTabs();
  if (currentTab === "historico") renderHistory();
  else renderWorkout();
  updateTimerDisplay();
}

function renderUpdateBanner() {
  const el = document.getElementById("updateBanner");
  if (!swUpdateAvailable) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="banner banner-info"><span>Nova versão disponível!</span>
    <button class="banner-action" id="doUpdate">Atualizar</button></div>`;
  el.querySelector("#doUpdate").onclick = () => location.reload();
}

function renderBackupReminder() {
  const el = document.getElementById("backupReminder");
  if (!state.history || state.history.length === 0) { el.innerHTML = ""; return; }
  if (state._hideBackupReminder) {
    const d = (Date.now() - state._hideBackupReminder) / 86400000;
    if (d < 3) { el.innerHTML = ""; return; }
    state._hideBackupReminder = null;
    saveState();
  }
  let show = false, msg = "";
  if (state.lastBackup) {
    const days = (Date.now() - new Date(state.lastBackup).getTime()) / 86400000;
    if (days > 7) { show = true; msg = `Faz ${Math.floor(days)} dias desde o último backup.`; }
  } else if (state.history.length >= 3) {
    show = true; msg = `Você tem ${state.history.length} treinos e ainda não fez backup.`;
  }
  if (show) {
    el.innerHTML = `<div class="banner banner-warn"><span>💾 ${msg}</span><button id="closeReminder">×</button></div>`;
    el.querySelector("#closeReminder").onclick = () => {
      state._hideBackupReminder = Date.now(); saveState(); el.innerHTML = "";
    };
  } else el.innerHTML = "";
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  state.treinos.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab" + (t.id === currentTab ? " active" : "");
    b.textContent = t.dia.slice(0, 3);
    b.onclick = () => {
      currentTab = t.id; saveState();
      if (!timerState.running) setPresetTimer(state.treinos.find(x => x.id === t.id).descanso || 90, true);
      render(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
    tabsEl.appendChild(b);
  });
  const hist = document.createElement("button");
  hist.className = "tab" + (currentTab === "historico" ? " active" : "");
  hist.textContent = "📊";
  hist.onclick = () => { currentTab = "historico"; saveState(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  tabsEl.appendChild(hist);
}

function renderWorkout() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const t = state.treinos.find(x => x.id === currentTab);
  if (!t) { currentTab = getTodayTab(); saveState(); render(); return; }

  const header = document.createElement("div");
  header.className = "day-header";
  header.innerHTML = `
    <div>
      <h2><span>${esc(t.nome)}</span> <button class="btn-icon" id="btnEditDayName">✏️</button></h2>
      <p class="day-subtitle">${esc(t.dia)} · ${esc(t.tipo)}</p>
    </div>
    <div class="day-actions">
      <button class="btn-mini" id="btnDupDay">📋</button>
      <button class="btn-mini" id="btnSaveTemplate">💾</button>
      <button class="btn-mini" id="btnLoadTemplate">📁</button>
      <button class="btn-mini" style="color:var(--danger); border-color:var(--danger);" id="deleteDay">🗑</button>
    </div>`;
  main.appendChild(header);
  header.querySelector("#btnEditDayName").onclick = () => editDayName(t);
  header.querySelector("#deleteDay").onclick = () => deleteDay(t.id);
  header.querySelector("#btnSaveTemplate").onclick = () => openSaveTemplateModal(t);
  header.querySelector("#btnLoadTemplate").onclick = () => openLoadTemplateModal(t);
  header.querySelector("#btnDupDay").onclick = () => duplicateDay(t);

  const cur = state.current[t.id];
  const allChecks = cur.checks.flat();
  const doneSets = allChecks.filter(Boolean).length;
  const totalSets = allChecks.length;
  const pct = totalSets ? Math.round(doneSets / totalSets * 100) : 0;

  const prog = document.createElement("div");
  prog.className = "progress-wrap";
  prog.innerHTML = `<div class="progress-info">
      <span>${pct === 100 ? "🎉 Treino concluído!" : "Progresso do dia"}</span>
      <span><strong>${doneSets}</strong> / ${totalSets} séries</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  main.appendChild(prog);

  const lastWorkout = [...state.history].reverse().find(h => h.dayId === t.id && !h.isRest);
  if (lastWorkout) {
    const repeatBtn = document.createElement("button");
    repeatBtn.className = "btn-repeat";
    repeatBtn.textContent = "🔁 Repetir treino anterior (" + fmtDate(lastWorkout.dateLocal) + ")";
    repeatBtn.onclick = () => repeatLastWorkout(t, lastWorkout);
    main.appendChild(repeatBtn);
  }

  t.exercicios.forEach((ex, ei) => {
    const card = document.createElement("div");
    const allDone = cur.checks[ei].every(Boolean);
    card.className = "exercise" + (allDone ? " completed" : "");

    const displayName = cur.customNames[ex.id] || ex.nome;
    // Fix item 1: se foi trocado, NÃO casa por id (só por nome)
    const wasSwapped = !!cur.customNames[ex.id];
    const lookupId = wasSwapped ? null : ex.id;
    const last = getLastSessionForExercise(lookupId, displayName);
    const pr = getPRForExercise(lookupId, displayName);
    const isTime = isTimeBased(ex.reps);
    const repsInputMode = isTime ? "text" : "numeric";

    let lastHtml = "";
    if (last && last.sets.filter(s => s.done).length) {
      const txt = last.sets.filter(s => s.done).map(s => `${esc(s.weight)}×${esc(s.reps)}`).join(" · ");
      lastHtml = `<div class="last-session has">Última (${fmtDate(last.date)}): ${txt}</div>`;
    } else {
      lastHtml = `<div class="last-session">Sem registro anterior</div>`;
    }

    const prHtml = pr.maxWeight > 0 ? `<span class="pr-badge">🏆 ${pr.maxWeight}kg</span>` : "";

    card.innerHTML = `
      <div class="exercise-head">
        <div class="exercise-title-wrap">
          <div class="exercise-name">
            <span>${esc(displayName)}</span>${prHtml}
            <button class="btn-move move-up" data-ei="${ei}" title="Mover para cima">⬆️</button>
            <button class="btn-move move-down" data-ei="${ei}" title="Mover para baixo">⬇️</button>
            <button class="btn-icon btn-swap" data-ei="${ei}" title="Trocar hoje">🔄</button>
            <button class="btn-icon btn-edit-ex" data-ei="${ei}" title="Editar">✏️</button>
          </div>
          <div class="exercise-muscles">${esc(ex.main || "")} ${ex.sec ? " | " + esc(ex.sec) : ""}</div>
        </div>
        <div class="exercise-meta">${ex.series}× · ${esc(ex.reps)}</div>
      </div>
      <textarea class="exercise-notes" data-ei="${ei}" placeholder="Notas do exercício...">${esc(cur.notes[ex.id] || "")}</textarea>
      <div class="exercise-sub">
        ${lastHtml}
        <button class="btn-bump" data-ei="${ei}">+2,5 kg</button>
      </div>
      <div class="sets-container"></div>`;

    const setsCont = card.querySelector(".sets-container");
    for (let si = 0; si < ex.series; si++) {
      const row = document.createElement("div");
      row.className = "set-row";
      const done = cur.checks[ei][si];
      const isWarm = cur.warmups[ei][si];
      const wPh = last && last.sets[si] && last.sets[si].weight ? last.sets[si].weight : "";
      const rPh = last && last.sets[si] && last.sets[si].reps ? last.sets[si].reps : "";
      row.innerHTML = `
        <span class="set-label${isWarm ? " warmup" : ""}">${isWarm ? "W" : (si+1)}</span>
        <button class="set-check${done ? " done" : ""}${isWarm ? " warmup" : ""}">${done ? "✓" : ""}</button>
        <input class="set-input inp-weight" type="text" inputmode="decimal" placeholder="${esc(wPh)}" value="${esc(cur.weights[ei][si] || "")}">
        <span class="set-unit">kg</span>
        <span class="set-x">×</span>
        <input class="set-input inp-reps reps" type="text" inputmode="${repsInputMode}" placeholder="${esc(rPh)}" value="${esc(cur.reps[ei][si] || "")}">
        <button class="set-mode set-mode-btn" data-si="${si}">${isWarm ? "🔥" : "W"}</button>
      `;
      const chk = row.querySelector(".set-check");
      const wIn = row.querySelector(".inp-weight");
      const rIn = row.querySelector(".inp-reps");
      const modeBtn = row.querySelector(".set-mode-btn");

      chk.onclick = () => {
        if (!cur.checks[ei][si]) {
          if (!cur.weights[ei][si] && wIn.placeholder) cur.weights[ei][si] = wIn.placeholder;
          if (!cur.reps[ei][si] && rIn.placeholder) cur.reps[ei][si] = rIn.placeholder;
        }
        toggleCheck(t, ei, si);
      };
      modeBtn.onclick = () => { cur.warmups[ei][si] = !cur.warmups[ei][si]; saveState(); render(); };

      let debW, debR;
      wIn.oninput = () => { clearTimeout(debW); debW = setTimeout(() => { cur.weights[ei][si] = wIn.value; saveState(); }, 500); };
      rIn.oninput = () => { clearTimeout(debR); debR = setTimeout(() => { cur.reps[ei][si] = rIn.value; saveState(); }, 500); };
      wIn.onblur = () => { clearTimeout(debW); cur.weights[ei][si] = wIn.value; saveState(); };
      rIn.onblur = () => { clearTimeout(debR); cur.reps[ei][si] = rIn.value; saveState(); };

      setsCont.appendChild(row);
    }

    card.querySelector(".move-up").onclick = () => moveExercise(t, ei, -1);
    card.querySelector(".move-down").onclick = () => moveExercise(t, ei, 1);
    card.querySelector(".btn-bump").onclick = () => bumpWeight(t, ei, 2.5);
    card.querySelector(".btn-swap").onclick = () => openSwapModal(t, ei, ex);
    card.querySelector(".btn-edit-ex").onclick = () => openExerciseModal(t, ei);

    const noteInput = card.querySelector(".exercise-notes");
    let noteTimer;
    noteInput.oninput = () => {
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => { cur.notes[ex.id] = noteInput.value; saveState(); }, 500);
    };
    noteInput.onblur = () => { clearTimeout(noteTimer); cur.notes[ex.id] = noteInput.value; saveState(); };

    main.appendChild(card);
  });

  const addExBtn = document.createElement("button");
  addExBtn.className = "btn-add-exercise";
  addExBtn.textContent = "+ Adicionar Exercício";
  addExBtn.onclick = () => openExerciseModal(t, -1);
  main.appendChild(addExBtn);

  const finish = document.createElement("button");
  finish.className = "btn-finish";
  finish.textContent = "✅ Finalizar e arquivar treino";
  finish.onclick = () => finalizarTreino(t, finish);
  main.appendChild(finish);

  const restBtn = document.createElement("button");
  restBtn.className = "btn-rest";
  restBtn.textContent = "😴 Registrar dia de descanso";
  restBtn.onclick = () => registrarDescanso(t);
  main.appendChild(restBtn);
}

/* ============ AÇÕES ============ */
function moveExercise(t, ei, dir) {
  const target = ei + dir;
  if (target < 0 || target >= t.exercicios.length) return;
  const c = state.current[t.id];
  const sw = (arr) => { const tmp = arr[ei]; arr[ei] = arr[target]; arr[target] = tmp; };
  sw(t.exercicios); sw(c.checks); sw(c.weights); sw(c.reps); sw(c.warmups);
  saveState(); render();
}

function bumpWeight(t, ei, delta) {
  const cur = state.current[t.id];
  const ex = t.exercicios[ei];
  const wasSwapped = !!cur.customNames[ex.id];
  const lookupId = wasSwapped ? null : ex.id;
  const last = getLastSessionForExercise(lookupId, cur.customNames[ex.id] || ex.nome);
  cur.weights[ei] = cur.weights[ei].map((w, i) => {
    let base = parseWeight(w);
    if (!base && last && last.sets[i]) base = parseWeight(last.sets[i].weight);
    if (!base) return w;
    return String(base + delta);
  });
  saveState(); render();
  showToast("+" + delta + " kg", "success");
}

function toggleCheck(t, ei, si) {
  const cur = state.current[t.id];
  cur.checks[ei][si] = !cur.checks[ei][si];
  // Fix item 6: persistir startedAt
  if (!state.sessionStarted[t.id]) {
    state.sessionStarted[t.id] = Date.now();
    saveState();
  }
  if (!cur.startedAt) { cur.startedAt = state.sessionStarted[t.id]; }
  saveState();
  if (navigator.vibrate) navigator.vibrate(10);
  ensureAudio();
  if (cur.checks[ei][si]) {
    requestWakeLock();
    setPresetTimer(t.descanso || 90, true);
    startTimer();
  }
  render();
}

async function finalizarTreino(t, btn) {
  if (archivedInFlight) return;
  const cur = state.current[t.id];

  // Item 8: não exigir carga em bodyweight/tempo
  const marcadasVazias = [];
  t.exercicios.forEach((ex, ei) => {
    const isTime = isTimeBased(ex.reps);
    const isBW = isBodyweightExercise(ex.nome);
    cur.checks[ei].forEach((done, si) => {
      if (!done) return;
      const w = cur.weights[ei][si];
      const r = cur.reps[ei][si];
      if (isTime) { if (!r) marcadasVazias.push(ex.nome); }
      else if (isBW) { if (!r) marcadasVazias.push(ex.nome); }
      else { if (!w || !r) marcadasVazias.push(ex.nome); }
    });
  });
  if (marcadasVazias.length > 0) {
    const ok = await confirmModal("Séries sem dados",
      `Existem ${marcadasVazias.length} série(s) sem carga/reps. Continuar?`,
      "Continuar", false);
    if (!ok) return;
  }

  const exercises = [];
  t.exercicios.forEach((ex, ei) => {
    const sets = [];
    let hasDone = false;
    for (let si = 0; si < ex.series; si++) {
      const done = cur.checks[ei][si];
      const w = parseWeight(cur.weights[ei][si]);
      const r = cur.reps[ei][si] || "";
      const isWarmup = cur.warmups[ei][si] || false;
      sets.push({ weight: w, reps: r, done, isWarmup });
      if (done) hasDone = true;
    }
    if (hasDone) {
      const doneSets = sets.filter(s => s.done && !s.isWarmup);
      const maxWeight = doneSets.length ? Math.max(...doneSets.map(s => parseWeight(s.weight))) : 0;
      const wasSwapped = !!(cur.customNames[ex.id] && cur.customNames[ex.id] !== ex.nome);
      const finalName = cur.customNames[ex.id] || ex.nome;
      // Item 1: id "sub_" + nome normalizado quando trocado
      const finalId = wasSwapped ? swapIdFor(finalName) : ex.id;
      const isBW = isBodyweightExercise(finalName);
      exercises.push({
        id: finalId, name: finalName, sets, maxWeight,
        note: cur.notes[ex.id] || "",
        targetReps: ex.reps,
        weightless: isBW
      });
    }
  });

  if (exercises.length === 0) { showToast("Marque ao menos uma série.", "warn"); return; }

  const ok = await confirmModal("Arquivar treino",
    `Arquivar este treino?<br><br>${exercises.length} exercício(s) com registro.`,
    "Arquivar", false);
  if (!ok) return;

  btn.disabled = true;
  btn.textContent = "Arquivando...";
  archivedInFlight = true;

  const now = new Date();
  // Item 6: usar startedAt persistido
  const startTime = state.sessionStarted[t.id] || cur.startedAt || now.getTime();
  const entry = {
    id: Date.now(),
    timestamp: now.getTime(),
    dateLocal: getLocalDateStr(now),
    startTime, endTime: now.getTime(),
    dayId: t.id, dayName: t.dia, workoutName: t.nome,
    exercises, isRest: false
  };
  state.history.push(entry);

  cur.checks = t.exercicios.map(e => Array(e.series).fill(false));
  cur.warmups = t.exercicios.map(e => Array(e.series).fill(false));
  cur.customNames = {};
  delete cur.startedAt;
  delete state.sessionStarted[t.id];

  saveState();
  releaseWakeLock();
  archivedInFlight = false;
  btn.disabled = false;
  btn.textContent = "✅ Finalizar e arquivar treino";

  showSummary(entry);
}

function showSummary(entry) {
  const durMin = Math.round((entry.endTime - entry.startTime) / 60000);
  const totalSets = entry.exercises.reduce((s, ex) => s + ex.sets.filter(x => x.done && !x.isWarmup).length, 0);
  const totalVol = calcSessionVolume(entry);

  // Item 7: exigir prior > 0
  const prs = [];
  entry.exercises.forEach(ex => {
    if (ex.weightless || isTimeBased(ex.targetReps)) return;
    ex.sets.forEach(s => {
      if (!s.done || s.isWarmup) return;
      if (isTimeBased(s.reps)) return;
      const w = parseWeight(s.weight);
      if (w <= 0) return;
      const prior = getPRForExercise(ex.id, ex.name, entry.id).maxWeight;
      if (prior > 0 && w > prior && !prs.find(p => p.name === ex.name)) {
        prs.push({ name: ex.name, weight: w });
      }
    });
  });

  const prev = [...state.history].reverse().find(h => h.dayId === entry.dayId && h.id !== entry.id && !h.isRest);
  let cmpHtml = "";
  if (prev) {
    const prevVol = calcSessionVolume(prev);
    const diff = totalVol - prevVol;
    const pct = prevVol ? Math.round(diff / prevVol * 100) : 0;
    cmpHtml = `<div class="summary-item"><span>vs. anterior</span><strong>${diff >= 0 ? "+" : ""}${Math.round(diff)} kg (${pct >= 0 ? "+" : ""}${pct}%)</strong></div>`;
  }

  document.getElementById("modalTitle").textContent = "🎉 Treino Concluído!";
  document.getElementById("modalBody").innerHTML = `
    <div class="summary-item"><span>Duração</span><strong>${durMin} min</strong></div>
    <div class="summary-item"><span>Séries concluídas</span><strong>${totalSets}</strong></div>
    <div class="summary-item"><span>Volume total</span><strong>${Math.round(totalVol)} kg</strong></div>
    ${cmpHtml}
    ${prs.length ? `<div style="margin-top:12px;"><div style="font-size:12px;color:var(--gold);font-weight:700;margin-bottom:6px;">🏆 NOVOS RECORDES</div>${prs.map(p => `<div style="font-size:13px;color:var(--gold);">${esc(p.name)}: ${p.weight} kg</div>`).join("")}</div>` : ""}
  `;
  const footer = document.getElementById("modalFooter");
  footer.innerHTML = `<button class="btn-primary" id="mOk">Fechar</button>`;
  footer.querySelector("#mOk").onclick = () => { closeModal(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  render();
  openModal();
}

async function registrarDescanso(t) {
  const ok = await confirmModal("Registrar Descanso",
    `Registrar <strong>${esc(t.dia)}</strong> como descanso?`, "Registrar", false);
  if (!ok) return;
  const now = new Date();
  state.history.push({
    id: Date.now(), timestamp: now.getTime(), dateLocal: getLocalDateStr(now),
    startTime: now.getTime(), endTime: now.getTime(),
    dayId: t.id, dayName: t.dia, workoutName: "Descanso",
    exercises: [], isRest: true
  });
  saveState(); showToast("Descanso registrado 😴", "success"); render();
}

async function repeatLastWorkout(t, lastEntry) {
  const ok = await confirmModal("Repetir treino",
    `Copiar cargas/reps de <strong>${fmtDate(lastEntry.dateLocal)}</strong>?`,
    "Copiar", false);
  if (!ok) return;
  const s = state.current[t.id];
  lastEntry.exercises.forEach(ex => {
    const idx = t.exercicios.findIndex(x => x.id === ex.id || x.nome === ex.name);
    if (idx < 0) return;
    ex.sets.forEach((set, si) => {
      if (si >= t.exercicios[idx].series) return;
      s.weights[idx][si] = String(set.weight || "");
      s.reps[idx][si] = set.reps || "";
    });
  });
  saveState(); render(); showToast("Valores copiados", "success");
}

/* ============ EDIÇÃO ============ */
function editDayName(t) {
  promptModal("Nome do treino", t.nome, (v) => { t.nome = v; saveState(); render(); showToast("Atualizado", "success"); });
}
async function deleteDay(id) {
  if (state.treinos.length <= 1) { showToast("Precisa ter ao menos 1 dia", "warn"); return; }
  const t = state.treinos.find(x => x.id === id);
  const ok = await confirmModal("Excluir dia", `Excluir <strong>${esc(t.nome)}</strong>?<br><br>Histórico será preservado.`, "Excluir", true);
  if (!ok) return;
  state.treinos = state.treinos.filter(x => x.id !== id);
  delete state.current[id];
  currentTab = state.treinos[0].id;
  saveState(); render(); showToast("Excluído", "success");
}

    <div class="form-group"><label>Região</label>
      <select id="inpExGroup" class="form-select">
        <option value="">Selecione...</option>
        ${Object.keys(dbExercicios).map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("")}
      </select>
    </div>
    <div class="form-group" id="groupExSelect"><label>Exercício</label><select id="inpExSelect" class="form-select"></select></div>
    <div class="form-group" id="groupExInput" style="display:none;"><label>Nome manual</label><input type="text" id="inpExNomeManual" class="form-input"></div>
    <div class="form-group"><label>Músculos Principais</label><input type="text" id="inpExMain" class="form-input" value="${esc(ex.main || "")}"></div>
    <div class="form-group"><label>Músculos Secundários</label><input type="text" id="inpExSec" class="form-input" value="${esc(ex.sec || "")}"></div>
    <div class="form-row">
      <div class="form-group"><label>Séries</label><input type="number" id="inpExSeries" class="form-input" value="${ex.series}" min="1"></div>
      <div class="form-group"><label>Reps</label><input type="text" id="inpExReps" class="form-input" value="${esc(ex.reps)}" placeholder="8-12, 30s..."></div>
    </div>
  `;

  const groupSelect = document.getElementById("inpExGroup");
  const exSelect = document.getElementById("inpExSelect");
  const exInputWrap = document.getElementById("groupExInput");
  const exInput = document.getElementById("inpExNomeManual");
  const mainInput = document.getElementById("inpExMain");
  const secInput = document.getElementById("inpExSec");
  const searchInput = document.getElementById("inpSearch");

  let currentGroup = "", isCustom = false;
  if (isEdit) {
    for (const [g, exs] of Object.entries(dbExercicios)) {
      if (exs[ex.nome]) { currentGroup = g; break; }
    }
    if (!currentGroup) { isCustom = true; currentGroup = Object.keys(dbExercicios)[0]; }
  }

  function populate(group, filter) {
    exSelect.innerHTML = "";
    if (!group || !dbExercicios[group]) return;
    Object.keys(dbExercicios[group]).forEach(name => {
      if (filter && !name.toLowerCase().includes(filter.toLowerCase())) return;
      const o = document.createElement("option");
      o.value = name; o.textContent = name;
      exSelect.appendChild(o);
    });
    const c = document.createElement("option");
    c.value = "custom"; c.textContent = "Outro (digitar)...";
    exSelect.appendChild(c);
  }

  if (isEdit) {
    groupSelect.value = currentGroup;
    populate(currentGroup);
    if (isCustom) { exSelect.value = "custom"; exInputWrap.style.display = "block"; exInput.value = ex.nome; }
    else exSelect.value = ex.nome;
  }

  groupSelect.onchange = () => {
    populate(groupSelect.value, searchInput.value);
    exSelect.value = "custom";
    exInputWrap.style.display = "block";
  };
  searchInput.oninput = () => { if (groupSelect.value) populate(groupSelect.value, searchInput.value); };
  exSelect.onchange = () => {
    const val = exSelect.value;
    if (val === "custom") { exInputWrap.style.display = "block"; exInput.value = ""; mainInput.value = ""; secInput.value = ""; }
    else {
      exInputWrap.style.display = "none";
      const g = groupSelect.value;
      if (g && dbExercicios[g][val]) { mainInput.value = dbExercicios[g][val][0]; secInput.value = dbExercicios[g][val][1]; }
    }
  };

  const footer = document.getElementById("modalFooter");
  footer.innerHTML = `
    ${isEdit ? '<button class="btn-danger-outline" id="btnDelEx">Excluir</button>' : ''}
    <button class="btn-primary" id="btnSaveEx">Salvar</button>
  `;

  if (isEdit) {
    footer.querySelector("#btnDelEx").onclick = async () => {
      const ok = await confirmModal("Excluir exercício", `Excluir <strong>${esc(ex.nome)}</strong>?`, "Excluir", true);
      if (!ok) return;
      const exId = t.exercicios[ei].id;
      t.exercicios.splice(ei, 1);
      const c = state.current[t.id];
      c.checks.splice(ei, 1); c.weights.splice(ei, 1); c.reps.splice(ei, 1); c.warmups.splice(ei, 1);
      delete c.customNames[exId]; delete c.notes[exId];
      saveState(); closeModal(); render(); showToast("Excluído", "success");
    };
  }

  footer.querySelector("#btnSaveEx").onclick = () => {
    const val = exSelect.value;
    let nome = (val === "custom" || exInputWrap.style.display === "block") ? exInput.value.trim() : val;
    if (!nome) { showToast("Digite o nome", "warn"); return; }
    const series = Math.max(1, parseInt(document.getElementById("inpExSeries").value) || 3);
    const reps = document.getElementById("inpExReps").value.trim() || "8-12";

    if (isEdit) {
      t.exercicios[ei] = { ...t.exercicios[ei], nome, main: mainInput.value.trim(), sec: secInput.value.trim(), series, reps };
      const c = state.current[t.id];
      if (c.checks[ei].length !== series) {
        c.checks[ei] = Array(series).fill(false);
        c.weights[ei] = Array(series).fill("");
        c.reps[ei] = Array(series).fill("");
        c.warmups[ei] = Array(series).fill(false);
      }
      // Limpa customName se editou permanentemente
      delete c.customNames[t.exercicios[ei].id];
    } else {
      const newId = generateId("ex");
      t.exercicios.push({ id: newId, nome, main: mainInput.value.trim(), sec: secInput.value.trim(), series, reps });
      const c = state.current[t.id];
      c.checks.push(Array(series).fill(false));
      c.weights.push(Array(series).fill(""));
      c.reps.push(Array(series).fill(""));
      c.warmups.push(Array(series).fill(false));
    }
    saveState(); closeModal(); render(); showToast("Salvo", "success");
  };
  openModal();
}

/* ============ HISTÓRICO ============ */
let historyFilter = "all";

function renderHistory() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="day-header"><div><h2>📊 Histórico & Evolução</h2><p class="day-subtitle">${state.history.length} sessões</p></div></div>`;
  if (state.history.length === 0) {
    const empty = document.createElement("div");
    empty.className = "history-empty"; empty.textContent = "Nenhum treino arquivado.";
    main.appendChild(empty); return;
  }

  const stats = document.createElement("div");
  stats.className = "stats-grid";
  const totalSessions = state.history.filter(h => !h.isRest).length;
  const totalVolKg = state.history.reduce((s, h) => s + calcSessionVolume(h), 0);
  const totalSets = state.history.reduce((s, h) => s + h.exercises.reduce((a, ex) => a + ex.sets.filter(x => x.done && !x.isWarmup).length, 0), 0);
  const volDisplay = totalVolKg >= 10000 ? (totalVolKg/1000).toFixed(1) + "t" : Math.round(totalVolKg) + "kg";
  stats.innerHTML = `
    <div class="stat-card"><div class="stat-value">${totalSessions}</div><div class="stat-label">Treinos</div></div>
    <div class="stat-card"><div class="stat-value">${totalSets}</div><div class="stat-label">Séries</div></div>
    <div class="stat-card"><div class="stat-value">${volDisplay}</div><div class="stat-label">Volume</div></div>
    <div class="stat-card"><div class="stat-value">${state.history.filter(h=>h.isRest).length}</div><div class="stat-label">Descansos</div></div>`;
  main.appendChild(stats);

  const allExNames = new Set();
  state.history.forEach(h => h.exercises.forEach(e => allExNames.add(e.name)));
  state.treinos.forEach(t => t.exercicios.forEach(e => allExNames.add(e.nome)));
  const options = [...allExNames].sort();

  if (options.length > 0) {
    const chartCard = document.createElement("div");
    chartCard.className = "chart-card";
    chartCard.innerHTML = `
      <h3>Evolução</h3>
      <select class="form-select" id="chartSelect" style="margin-bottom:10px;">
        ${options.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("")}
      </select>
      <div class="chart-tabs">
        <button class="chart-tab active" data-type="weight">Carga</button>
        <button class="chart-tab" data-type="volume">Volume</button>
        <button class="chart-tab" data-type="reps">Reps/Tempo</button>
      </div>
      <canvas id="chartCanvas" class="chart-canvas"></canvas>`;
    main.appendChild(chartCard);

    const select = chartCard.querySelector("#chartSelect");
    const canvas = chartCard.querySelector("#chartCanvas");
    let chartType = "weight";
    select.value = state._chartEx && options.includes(state._chartEx) ? state._chartEx : options[0];
    select.onchange = () => { state._chartEx = select.value; saveState(); drawChart(canvas, select.value, chartType); };
    chartCard.querySelectorAll(".chart-tab").forEach(btn => {
      btn.onclick = () => {
        chartCard.querySelectorAll(".chart-tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        chartType = btn.dataset.type;
        drawChart(canvas, select.value, chartType);
      };
    });
    requestAnimationFrame(() => drawChart(canvas, select.value, chartType));
  }

  const filters = document.createElement("div");
  filters.className = "history-filters";
  [{key:"all",l:"Tudo"},{key:"7d",l:"7 dias"},{key:"30d",l:"30 dias"},{key:"90d",l:"90 dias"}].forEach(f => {
    const b = document.createElement("button");
    b.className = "filter-btn" + (historyFilter === f.key ? " active" : "");
    b.textContent = f.l;
    b.onclick = () => { historyFilter = f.key; renderHistory(); };
    filters.appendChild(b);
  });
  main.appendChild(filters);

  const now = Date.now();
  const cutoff = historyFilter === "7d" ? now - 7*86400000 :
                 historyFilter === "30d" ? now - 30*86400000 :
                 historyFilter === "90d" ? now - 90*86400000 : 0;
  const sorted = [...state.history].sort((a,b) => b.timestamp - a.timestamp).filter(h => h.timestamp >= cutoff);

  if (sorted.length === 0) {
    const empty = document.createElement("div");
    empty.className = "history-empty"; empty.textContent = "Nenhuma sessão no período.";
    main.appendChild(empty); return;
  }

  sorted.forEach(entry => {
    const item = document.createElement("div");
    item.className = "history-item";
    const vol = entry.isRest ? 0 : calcSessionVolume(entry);
    const dur = entry.endTime && entry.startTime && entry.endTime > entry.startTime ? Math.round((entry.endTime - entry.startTime) / 60000) : 0;
    item.innerHTML = `
      <div class="history-summary">
        <div>
          <div class="history-date">${fmtDate(entry.dateLocal)} ${entry.isRest ? "😴" : ""}</div>
          <div class="history-info">${esc(entry.dayName)} · ${esc(entry.workoutName)} · ${entry.isRest ? "Descanso" : entry.exercises.length + " exerc." + (vol>0 ? " · " + Math.round(vol) + " kg" : "") + (dur ? " · " + dur + " min" : "")}</div>
        </div>
        <div class="history-chevron">▸</div>
      </div>
      <div class="history-details">
        ${entry.isRest ? '<p style="color:var(--muted);font-size:13px;">Descanso.</p>' :
          entry.exercises.map(ex => `
            <div class="history-ex">
              <div class="history-ex-name">
                <span>${esc(ex.name)}</span>
                <button class="btn-small-danger" data-del-ex="${esc(ex.id)}">×</button>
              </div>
              <div class="history-ex-sets">${ex.sets.filter(s => s.done).map(s => `${s.isWarmup ? "W:" : ""}${s.weight ? s.weight + "kg" : "—"}×${esc(s.reps || "—")}`).join(" · ") || "—"}</div>
              ${ex.note ? `<div class="history-ex-note">📝 ${esc(ex.note)}</div>` : ""}
            </div>`).join("")}
        <button class="btn-danger-outline" style="margin-top:10px;padding:6px 10px;font-size:12px;width:100%;" data-del-entry="${entry.id}">🗑 Apagar sessão</button>
      </div>`;
    item.querySelector(".history-summary").onclick = () => item.classList.toggle("open");
    item.querySelectorAll("[data-del-entry]").forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        const ok = await confirmModal("Apagar sessão", "Apagar esta sessão?", "Apagar", true);
        if (!ok) return;
        state.history = state.history.filter(h => h.id !== entry.id);
        saveState(); renderHistory(); showToast("Apagada", "success");
      };
    });
    item.querySelectorAll("[data-del-ex]").forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        const exId = btn.dataset.delEx;
        const ok = await confirmModal("Apagar exercício", "Remover este exercício?", "Apagar", true);
        if (!ok) return;
        entry.exercises = entry.exercises.filter(ex => ex.id !== exId);
        saveState(); renderHistory(); showToast("Removido", "success");
      };
    });
    main.appendChild(item);
  });
}

function drawChart(canvas, exName, type) {
  const points = [];
  state.history.forEach(entry => {
    if (entry.isRest) return;
    const ex = entry.exercises.find(e => e.name === exName);
    if (!ex) return;
    const doneSets = ex.sets.filter(s => s.done && !s.isWarmup);
    if (doneSets.length === 0) return;
    let val = 0;
    if (type === "weight") val = Math.max(...doneSets.map(s => parseWeight(s.weight)));
    else if (type === "volume") val = doneSets.reduce((a, s) => a + parseWeight(s.weight) * parseReps(s.reps), 0);
    else if (type === "reps") val = Math.max(...doneSets.map(s => parseReps(s.reps)));
    if (val > 0) points.push({ ts: entry.timestamp, date: entry.dateLocal, value: val });
  });
  points.sort((a, b) => a.ts - b.ts);

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width) return;
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  const pad = { top: 15, right: 15, bottom: 32, left: 50 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  if (points.length === 0) {
    ctx.fillStyle = "#7f889e"; ctx.font = "13px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Sem dados", W / 2, H / 2); return;
  }

  const vals = points.map(p => p.value);
  let minV = Math.min(...vals), maxV = Math.max(...vals);
  if (minV === maxV) { minV = minV * 0.9; maxV = maxV * 1.1; }
  const range = maxV - minV;
  const yMin = Math.max(0, minV - range * 0.15);
  const yMax = maxV + range * 0.15;

  ctx.strokeStyle = "#262b38"; ctx.fillStyle = "#7f889e";
  ctx.font = "11px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ch / 4) * i;
    const val = yMax - ((yMax - yMin) / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    ctx.fillText(val.toFixed(0), pad.left - 6, y);
  }

  const getX = i => points.length === 1 ? pad.left + cw/2 : pad.left + (i/(points.length-1))*cw;
  const getY = v => pad.top + ch - ((v - yMin)/(yMax - yMin))*ch;

  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
  grad.addColorStop(0, "rgba(34,197,94,0.3)"); grad.addColorStop(1, "rgba(34,197,94,0)");
  ctx.fillStyle = grad; ctx.beginPath();
  ctx.moveTo(getX(0), pad.top + ch);
  points.forEach((p, i) => ctx.lineTo(getX(i), getY(p.value)));
  ctx.lineTo(getX(points.length - 1), pad.top + ch);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = "#22c55e"; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = getX(i), y = getY(p.value);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  points.forEach((p, i) => {
    const x = getX(i), y = getY(p.value);
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "#22c55e"; ctx.fill();
    ctx.strokeStyle = "#0b0d12"; ctx.lineWidth = 2; ctx.stroke();
  });

  ctx.fillStyle = "#7f889e"; ctx.font = "10px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const step = Math.max(1, Math.ceil(points.length / 5));
  points.forEach((p, i) => {
    if (i % step === 0 || i === points.length - 1) {
      const d = String(p.date).split("-");
      ctx.fillText(`${d[2]}/${d[1]}`, getX(i), H - pad.bottom + 8);
    }
  });
}

document.getElementById("btnBackup").onclick = async () => {
  const ok = await confirmModal("Gerar Backup",
    "Salvar arquivo com todos os dados?<br><br>Guarde em local seguro.", "Salvar", false);
  if (!ok) return;
  try {
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const filename = `meu_treino_backup_${getLocalDateStr()}.json`;

    if (navigator.share && navigator.canShare) {
      try {
        const file = new File([blob], filename, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "Backup" });
          state.lastBackup = new Date().toISOString();
          state._hideBackupReminder = null;
          saveState(); render(); showToast("Compartilhado", "success");
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);

    state.lastBackup = new Date().toISOString();
    state._hideBackupReminder = null;
    saveState(); render();
    showToast("Backup gerado!", "success");
  } catch (e) { showToast("Erro: " + e.message, "error"); }
};

document.getElementById("btnRestore").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (evt) => {
    let parsed;
    try { parsed = JSON.parse(evt.target.result); }
    catch { showToast("JSON inválido", "error"); return; }
    if (!parsed || !Array.isArray(parsed.treinos) || !Array.isArray(parsed.history)) {
      showToast("Backup incompleto", "error"); return;
    }
    for (const t of parsed.treinos) {
      if (!t.id || !t.dia || !t.nome || !Array.isArray(t.exercicios)) { showToast("Treino inválido", "error"); return; }
      for (const ex of t.exercicios) {
        if (!ex.nome || typeof ex.series !== "number") { showToast("Exercício inválido", "error"); return; }
      }
    }
    const ok = await confirmModal("Restaurar",
      `Backup com ${parsed.treinos.length} treino(s) e ${parsed.history.length} sessão(ões).<br><br><strong>Substituirá todos os dados.</strong>`,
      "Restaurar", true);
    if (!ok) return;
    try { localStorage.setItem("treinoApp_backup_auto", JSON.stringify(state)); } catch {}
    showToast("Restaurando...", "warn");
    state = migrateData(parsed);
    currentTab = getTodayTab();
    saveState(); render();
    showToast("Restaurado!", "success");
  };
  reader.readAsText(file);
  e.target.value = "";
};

document.getElementById("btnResetAll").onclick = async () => {
  const ok = await confirmModal("Zerar", "Apaga TUDO: treinos, histórico, cargas. Continuar?", "Continuar", true);
  if (!ok) return;
  document.getElementById("modalTitle").textContent = "Confirmação Final";
  document.getElementById("modalBody").innerHTML = `
    <p style="color:var(--danger);font-size:14px;font-weight:600;">Irreversível!</p>
    <p style="font-size:13px;">Digite <strong>ZERAR</strong>:</p>
    <input type="text" id="zeroConfirm" class="form-input" autocomplete="off">`;
  const footer = document.getElementById("modalFooter");
  footer.innerHTML = `<button class="btn-secondary" id="mCancel">Cancelar</button><button class="btn-danger" id="mZero">Zerar</button>`;
  footer.querySelector("#mCancel").onclick = closeModal;
  footer.querySelector("#mZero").onclick = () => {
    if (document.getElementById("zeroConfirm").value.trim() !== "ZERAR") { showToast("Digite ZERAR", "error"); return; }
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(TIMER_KEY);
      localStorage.removeItem("treinoApp_backup_auto");
      localStorage.removeItem(LEGACY_INSTALL_KEY);
      LEGACY_KEYS.forEach(k => localStorage.removeItem(k));
    } catch {}
    location.reload();
  };
  openModal();
};

/* ============ TIMER ============ */
function saveTimer() {
  safeSet(TIMER_KEY, JSON.stringify({
    duration: timerState.duration, remaining: timerState.remaining,
    running: timerState.running, endTime: timerState.endTime, muted: timerState.muted
  }));
}
function loadTimer() {
  try {
    const raw = safeGet(TIMER_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    timerState.duration = d.duration || 60;
    timerState.muted = !!d.muted;
    if (d.running && d.endTime) {
      const rem = Math.ceil((d.endTime - Date.now()) / 1000);
      if (rem > 0) { timerState.running = true; timerState.endTime = d.endTime; timerState.remaining = rem; startTimerInterval(); }
      else { timerState.remaining = 0; timerState.running = false; }
    } else {
      timerState.remaining = d.remaining || d.duration || 60;
      timerState.running = false;
    }
  } catch {}
}
function setPresetTimer(sec, force) {
  if (timerState.running && !force) return;
  clearInterval(timerState.interval); timerState.running = false;
  timerState.duration = sec; timerState.remaining = sec; timerState.endTime = null;
  document.getElementById("startPause").textContent = "▶";
  document.querySelectorAll(".preset[data-sec]").forEach(b => b.classList.toggle("active", parseInt(b.dataset.sec) === sec));
  updateTimerDisplay(); saveTimer();
}
function updateTimerDisplay() {
  const m = Math.floor(timerState.remaining / 60);
  const s = timerState.remaining % 60;
  document.getElementById("timerDisplay").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function startTimerInterval() {
  clearInterval(timerState.interval);
  timerState.interval = setInterval(() => {
    if (!timerState.running) return;
    const rem = Math.max(0, Math.ceil((timerState.endTime - Date.now()) / 1000));
    timerState.remaining = rem;
    updateTimerDisplay();
    if (rem <= 0) {
      clearInterval(timerState.interval); timerState.running = false;
      document.getElementById("startPause").textContent = "▶";
      saveTimer(); onTimerEnd();
    }
  }, 200);
}
function startTimer() {
  if (timerState.running) return;
  if (timerState.remaining <= 0) timerState.remaining = timerState.duration;
  timerState.running = true;
  timerState.endTime = Date.now() + timerState.remaining * 1000;
  document.getElementById("startPause").textContent = "⏸";
  startTimerInterval(); updateTimerDisplay(); saveTimer();
}
function stopTimer() {
  if (!timerState.running) return;
  timerState.remaining = Math.max(0, Math.ceil((timerState.endTime - Date.now()) / 1000));
  timerState.running = false; clearInterval(timerState.interval);
  document.getElementById("startPause").textContent = "▶";
  updateTimerDisplay(); saveTimer();
}
function onTimerEnd() {
  // Item 5: se já passou muito tempo, não bipar
  const elapsed = Date.now() - (timerState.endTime || 0);
  if (elapsed > 10000) {
    // só mostra o toast
    showToast("Descanso terminou há um tempo", "warn");
    return;
  }
  if (!timerState.muted) { beep(0); beep(250); beep(500); }
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
  const bar = document.getElementById("timerBar");
  bar.classList.add("ringing");
  setTimeout(() => bar.classList.remove("ringing"), 3000);
  showToast("Descanso finalizado! 💪", "success");
}

document.getElementById("startPause").onclick = () => { if (timerState.running) stopTimer(); else startTimer(); };
document.getElementById("resetTimer").onclick = () => {
  clearInterval(timerState.interval); timerState.running = false;
  timerState.remaining = timerState.duration; timerState.endTime = null;
  document.getElementById("startPause").textContent = "▶";
  updateTimerDisplay(); saveTimer();
};
document.querySelectorAll(".timer-btn[data-action]").forEach(btn => {
  btn.onclick = () => {
    const d = parseInt(btn.dataset.action);
    if (timerState.running && timerState.endTime) {
      timerState.endTime += d * 1000;
      timerState.remaining = Math.max(0, Math.ceil((timerState.endTime - Date.now()) / 1000));
    } else {
      timerState.remaining = Math.max(0, timerState.remaining + d);
    }
    updateTimerDisplay(); saveTimer();
  };
});
document.querySelectorAll(".preset[data-sec]").forEach(btn => {
  btn.onclick = () => setPresetTimer(parseInt(btn.dataset.sec), true);
});
document.getElementById("muteBtn").onclick = () => {
  timerState.muted = !timerState.muted;
  document.getElementById("muteBtn").textContent = timerState.muted ? "🔕" : "🔔";
  saveTimer();
};

/* ============ VISIBILITY ============ */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    ensureAudio(); // retomar áudio (item 11)
    if (timerState.running && timerState.endTime) {
      const rem = Math.max(0, Math.ceil((timerState.endTime - Date.now()) / 1000));
      timerState.remaining = rem;
      if (rem <= 0) {
        timerState.running = false;
        clearInterval(timerState.interval);
        document.getElementById("startPause").textContent = "▶";
        saveTimer(); updateTimerDisplay();
        onTimerEnd(); // onTimerEnd checa elapsed > 10s
      } else updateTimerDisplay();
    }
    if (Object.keys(state.sessionStarted || {}).length > 0) requestWakeLock();
  }
});

/* ============ SERVICE WORKER ============ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(reg => {
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) {
            swUpdateAvailable = true;
            renderUpdateBanner();
          }
        });
      });
    }).catch(err => console.log("SW:", err));
  });
}

/* ============ INIT ============ */
cleanupLegacyKeys();
ensureData();
setupIcons();
loadTimer();
if (currentTab !== "historico") {
  const d = state.treinos.find(x => x.id === currentTab);
  if (!d) currentTab = getTodayTab();
  if (!timerState.running) setPresetTimer(d ? (d.descanso || 90) : 90, true);
}
document.getElementById("muteBtn").textContent = timerState.muted ? "🔕" : "🔔";
updateTimerDisplay();
render();

window.addEventListener("error", (e) => console.error("Erro:", e.message));
window.addEventListener("unhandledrejection", (e) => console.error("Promise:", e.reason));
</script>
</body>
